<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Zomboid B42 Sandbox Config Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <h1 id="app-title" class="app-title">Project Zomboid B42 Sandbox Config Editor</h1>
        <span id="version-badge" class="version-badge"></span>
    </div>
    <div class="topbar-right">
        <input id="search-input" class="search-input" type="search" placeholder="Search parameters...">
        <button id="lang-toggle" class="btn btn-lang" type="button" aria-pressed="false">
            <span class="lang-flag">🇬🇧</span><span class="lang-sep">/</span><span class="lang-flag">🇺🇦</span>
        </button>
        <button id="load-file-btn" class="btn" type="button">Load file</button>
        <input id="file-input" type="file" accept=".lua" hidden>
        <span id="auth-status" class="auth-status" hidden></span>
        <a id="login-link" class="btn" href="#" hidden>Log in to sync</a>
        <button id="sync-pull-btn" class="btn" type="button" hidden>Sync from server</button>
        <button id="sync-push-btn" class="btn" type="button" hidden>Sync to server</button>
        <button id="server-btn" class="btn" type="button" hidden>Server</button>
        <button id="export-btn" class="btn btn-primary" type="button">Export .lua</button>
    </div>
</header>

<div id="layout" class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Sections"></nav>

    <main id="main-panel" class="main-panel"></main>
</div>

<div id="onboarding-screen" class="onboarding-screen" hidden>
    <div class="onboarding-card">
        <h2 id="onboarding-title"></h2>
        <p id="onboarding-body"></p>
        <div class="onboarding-actions">
            <button id="onboarding-scratch-btn" class="btn btn-primary" type="button"></button>
            <button id="onboarding-import-btn" class="btn" type="button"></button>
        </div>
    </div>
</div>

<div id="tooltip-layer" class="tooltip-layer" role="tooltip" hidden></div>

<div id="export-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="export-modal-title">
        <h2 id="export-modal-title">Confirm export</h2>
        <p id="export-modal-body"></p>
        <div class="modal-actions">
            <button id="export-cancel-btn" class="btn" type="button">Cancel</button>
            <button id="export-confirm-btn" class="btn btn-primary" type="button">Export</button>
        </div>
    </div>
</div>

<div id="sync-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sync-modal-title">
        <h2 id="sync-modal-title">Sync to server</h2>
        <p id="sync-modal-body"></p>
        <div id="sync-progress" class="sync-progress" hidden>
            <div id="sync-progress-bar" class="sync-progress-bar"></div>
        </div>
        <div id="sync-log" class="sync-log" hidden></div>
        <div class="modal-actions">
            <button id="sync-cancel-btn" class="btn" type="button">Cancel</button>
            <button id="sync-bg-btn" class="btn" type="button" hidden>Run in background</button>
            <button id="sync-confirm-btn" class="btn btn-primary" type="button">Sync &amp; restart</button>
        </div>
    </div>
</div>

<div id="sync-bg-indicator" class="sync-bg-indicator" hidden role="button" tabindex="0">
    <span class="sync-bg-spinner"></span>
    <span id="sync-bg-text"></span>
</div>

<div id="server-modal" class="modal-overlay" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="server-modal-title">
        <h2 id="server-modal-title">Server</h2>

        <div class="server-tabs" role="tablist">
            <button class="server-tab-btn" type="button" role="tab" data-tab="status">Status</button>
            <button class="server-tab-btn" type="button" role="tab" data-tab="players">Players</button>
            <button class="server-tab-btn" type="button" role="tab" data-tab="options">Options</button>
            <button class="server-tab-btn" type="button" role="tab" data-tab="world">World</button>
            <button class="server-tab-btn" type="button" role="tab" data-tab="logs">Logs</button>
        </div>

        <div id="server-tab-status" class="server-tab-panel" data-tab-panel="status">
            <div class="server-status-line">
                <span id="server-status-dot" class="server-status-dot"></span>
                <span id="server-status-text"></span>
            </div>
            <div id="server-players" class="server-players"></div>
            <div class="server-announce-row">
                <input id="announce-input" class="search-input" type="text" maxlength="200" placeholder="Message to broadcast in-game…">
                <button id="announce-send-btn" class="btn btn-primary" type="button">Send</button>
            </div>
        </div>

        <div id="server-tab-players" class="server-tab-panel" data-tab-panel="players" hidden>
            <div id="server-players-list" class="server-players-list"></div>
        </div>

        <div id="server-tab-options" class="server-tab-panel" data-tab-panel="options" hidden>
            <p class="server-tab-note">These apply live — no restart needed.</p>
            <div id="server-options-list" class="param-grid server-options-grid"></div>
        </div>

        <div id="server-tab-world" class="server-tab-panel" data-tab-panel="world" hidden>
            <div id="server-world-list" class="server-world-list"></div>
        </div>

        <div id="server-tab-logs" class="server-tab-panel" data-tab-panel="logs" hidden>
            <div class="server-log-file-row">
                <select id="server-log-file-select" class="server-log-file-select"></select>
            </div>
            <pre id="server-log-view" class="server-log-view"></pre>
        </div>

        <div class="modal-actions">
            <button id="server-close-btn" class="btn" type="button">Close</button>
        </div>
    </div>
</div>

<div id="player-action-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="player-action-modal-title">
        <h2 id="player-action-modal-title">Confirm</h2>
        <p id="player-action-modal-body"></p>
        <div class="modal-actions">
            <button id="player-action-cancel-btn" class="btn" type="button">Cancel</button>
            <button id="player-action-confirm-btn" class="btn btn-primary" type="button">Confirm</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="lua-parser.js"></script>
<script src="app.js"></script>
</body>
</html>
